[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conti-agent"
version = "0.1.0"
description = "一个小型、可审计的 Python coding-agent 运行时"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tui = ["prompt-toolkit>=3.0,<4"]
yaml = ["PyYAML>=6.0"]
http = ["httpx>=0.27"]
websockets = ["websockets>=12"]
all = ["prompt-toolkit>=3.0,<4", "PyYAML>=6.0", "httpx>=0.27", "websockets>=12"]
build-exe = ["pyinstaller>=6.10; sys_platform == 'win32'"]

[project.scripts]
conti-agent = "conti_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
