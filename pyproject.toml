[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conti-agent"
version = "0.1.0"
description = "A small, auditable Python coding-agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
http = ["httpx>=0.27"]
websockets = ["websockets>=12"]
all = ["PyYAML>=6.0", "httpx>=0.27", "websockets>=12"]

[project.scripts]
conti-agent = "conti_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
